specVersion: 1.0.0
description: >
  Roll Call - protocol-agnostic authority and recovered-approval index. One schema for
  Ownable, AccessControl, EIP-1967 proxies and Safe, so a single query shape answers
  "who can change this contract, and are they still awake?" for any protocol.
repository: https://github.com/rollcall/rollcall
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: SafeFactory
    network: mainnet
    source:
      address: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"   # SafeProxyFactory 1.3.0
      abi: SafeProxyFactory
      # Narrowed deliberately. Indexing every Safe since 2021 is days of sync for a demo;
      # this window is recent enough to carry live activity and honest about its coverage.
      startBlock: 25800000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities: [Contract]
      abis:
        - name: SafeProxyFactory
          file: ./abis/SafeProxyFactory.json
        - name: Safe
          file: ./abis/Safe.json
      eventHandlers:
        - event: ProxyCreation(address,address)
          handler: handleProxyCreation

templates:
  - kind: ethereum/contract
    name: Safe
    network: mainnet
    source:
      abi: Safe
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/safe.ts
      entities: [Contract, AuthorityRecord, SignerApproval, Signer, SafeExecution]
      abis:
        - name: Safe
          file: ./abis/Safe.json
      eventHandlers:
        # receipt: true gives the mapping access to the transaction, and therefore to the
        # execTransaction calldata that carries the signature blob we recover approvers from.
        - event: ExecutionSuccess(bytes32,uint256)
          handler: handleExecutionSuccess
          receipt: true
        - event: ExecutionFailure(bytes32,uint256)
          handler: handleExecutionFailure
          receipt: true
        - event: AddedOwner(address)
          handler: handleAddedOwner
        - event: RemovedOwner(address)
          handler: handleRemovedOwner
        - event: ChangedThreshold(uint256)
          handler: handleChangedThreshold
