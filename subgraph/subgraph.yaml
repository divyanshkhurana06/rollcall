  - kind: ethereum/contract
    name: Safe0
    network: mainnet
    source:
      address: "0xe8a80C66fCAa4cd9268bC48a387f354d3F2fc171"
      abi: Safe
      startBlock: 25600000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/safe.ts
      entities: [Contract, AuthorityRecord, SignerApproval, Signer, SafeExecution]
      abis:
        - name: Safe
          file: ./abis/Safe.json
      eventHandlers:
        - event: ExecutionSuccess(bytes32,uint256)
          handler: handleExecutionSuccess
          receipt: true
        - event: ExecutionFailure(bytes32,uint256)
          handler: handleExecutionFailure
