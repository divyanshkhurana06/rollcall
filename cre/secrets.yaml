# ==========================================================================
# CRE SECRETS
# ==========================================================================
# Maps the secret id a workflow requests with `runtime.getSecret({ id })` to the
# environment variable holding its value.
#
# These are released by the Vault DON directly into the attested enclave. They
# are never in plaintext to node operators or in Workflow DON node memory.
#
# Every one of these is something an adversary would pay for:
#   the watchlist is an exposure map, the rules say where a position can be
#   pushed and how far its emergency capital stretches, the signing key moves
#   the position, and the API credential buys the reports that drive all of it.
secretsNames:
    ROLLCALL_API_KEY:
        - SECRET_ROLLCALL_API_KEY
    ROLLCALL_WATCHLIST:
        - SECRET_ROLLCALL_WATCHLIST
    PROTECTION_RULES:
        - SECRET_PROTECTION_RULES
    CHALLENGE_PRIVATE_KEY:
        - SECRET_CHALLENGE_PRIVATE_KEY
